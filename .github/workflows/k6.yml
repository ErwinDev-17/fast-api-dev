name: CI Pipeline - Pruebas de Rendimiento K6

on:
  workflow_run:
    workflows:
      - 'CI Pipeline - Análisis SAST con SonarQube'
    types:
      - completed

jobs:
  k6-performance:
    name: Prueba de Rendimiento K6
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Dependencias
        run: npm ci

      - name: Iniciar Servidor Node.js
        run: |
          npm start &
          echo "Esperando a que el servidor levante..."
          sleep 5

      - name: Verificar si ya prendio el servidor
        run: |
          curl -f http://localhost:3001/health

      - name: Instalar K6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69

          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list

          sudo apt-get update
          sudo apt-get install -y k6

      - name: Ejecutar pruebas de carga K6
        env:
          BASE_URL: http://localhost:3001
        run: |
          k6 run \
            --out json=k6-results.json \
            --summary-export=k6-summary.json \
            k6/k6.js

      - name: Subir reporte K6
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-performance-report
          path: |
            k6-results.json
            k6-summary.json
          retention-days: 30
