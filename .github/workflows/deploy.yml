name: CI/CD Pipeline - Node.js to GHCR

on:
  workflow_run:
    workflows:
      - 'CI Pipeline - Pruebas de Rendimiento K6'
    types:
      - completed
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Iniciar Sesion en Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Set image name to lowercase
        run: echo "IMAGE_NAME_LOWER=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Deploy to Cloud Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          proxy_host: ${{ secrets.BASTION_HOST }}
          proxy_username: ${{ secrets.SERVER_USER }}
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_port: 22
          script: |
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "==== BLUE/GREEN DEPLOY ===="

            # Leer estado
            CURRENT=$(cat /etc/nginx/current_deploy.env | cut -d'=' -f2)

            echo "Estado actual: $CURRENT"

            # Lógica de inversión
            if [ "$CURRENT" == "blue" ]; then
              TARGET="green"
              PORT=3004
            else
              TARGET="blue"
              PORT=3001
            fi

            echo "Nuevo entorno: $TARGET ($PORT)"

            # Descargar imagen
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:main

            # Ejecutar contenedor
            docker rm -f app_$TARGET || true

            docker run -d \
              -p $PORT:3001 \
              --name app_$TARGET \
              --restart always \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:main

            # envsubst
            export COLOR=$TARGET
            export PORT=$PORT

            envsubst < /etc/nginx/templates/nginx.conf.app.template > /etc/nginx/environments/bg/nginx_$TARGET.conf

            # Cambiar tráfico
            ln -sf /etc/nginx/environments/bg/nginx_$TARGET.conf /etc/nginx/conf.d/default.conf

            nginx -t && systemctl reload nginx

            # Actualizar estado
            echo "CURRENT=$TARGET" > /etc/nginx/current_deploy.env

            echo "Deploy completado en $TARGET"