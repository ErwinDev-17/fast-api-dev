name: CI Pipeline - Análisis SAST con SonarQube

on:
  workflow_run:
    workflows:
      - "CI - Node.js"
    types:
      - completed

jobs:
  sonarQube-analysis:
    name: Análisis de Calidad de Código
    runs-on: ubuntu-latest

    steps:
      - name: Clonación del repositorio (Checkout)
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Requerido por SonarQube para un análisis histórico completo

      - name: Ejecución de Escáner SonarQube
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=fast-api-dev
            -Dsonar.qualitygate.wait=true
